info:
  name: Productos por categoría
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/productos?categoria_id=1"
  params:
    - name: categoria_id
      value: "1"
      type: query
    - name: solo_activos
      value: "true"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token_operador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
