info:
  name: Login analista
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "analista",
        "password": "Analista#2026"
      }

runtime:
  scripts:
    - type: after-response
      code: "test('200', () => expect(res.getStatus()).to.equal(200));\r

        bru.setCollectionVar('token_analista', res.getBody().access_token);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
