services:
  postgres:
    image: postgres:16
    container_name: datamarket-postgres
    environment:
      POSTGRES_DB: datamarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datamarket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
